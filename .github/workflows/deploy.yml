name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check:security

      - run: npm run check:types

      - run: npm test

      - run: npm run build

      - run: npm run check:seo

      - name: Verify production edge before deploy
        run: npm run check:production-edge -- --allow-cloudflare-challenge

      - run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - run: npm run check:seo
        env:
          SEO_BASE_URL: https://lako-services.bragin-arbitr.workers.dev

      - name: Verify complete identity responses on workers.dev
        run: >-
          npm run check:identity-response --
          https://lako-services.bragin-arbitr.workers.dev/
          https://lako-services.bragin-arbitr.workers.dev/small-business/
          https://lako-services.bragin-arbitr.workers.dev/en/small-business/
          https://lako-services.bragin-arbitr.workers.dev/efaktura/

      - name: Verify complete custom-domain identity responses
        run: >-
          npm run check:identity-response --
          https://lako.services/
          https://lako.services/small-business/
          https://lako.services/en/small-business/
          https://lako.services/efaktura/

      - name: Verify production edge after deploy
        run: npm run check:production-edge
